services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: loqme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loqme
    ports:
      - "5432:5432"
    volumes:
      - loqme_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loqme"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  loqme_pgdata:
    driver: local
