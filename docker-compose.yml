services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: loqme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loqme
    ports:
      - "5432:5432"
    volumes:
      - loqme_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loqme"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_MAP_API_KEY: ${NEXT_PUBLIC_MAP_API_KEY:-eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsImp0aSI6ImM1ODI4YTAyOTA1ZDNiZTAzNDYzZTNkZmM2Mzc2YTZlMTE3NzhmYTdhZDA0OGJkNzdkZGYxNDM0ZmNiMGEzODE5MWQ3ZWEyODU2Y2QxMzE3In0.eyJhdWQiOiI0NDEyNiIsImp0aSI6ImM1ODI4YTAyOTA1ZDNiZTAzNDYzZTNkZmM2Mzc2YTZlMTE3NzhmYTdhZDA0OGJkNzdkZGYxNDM0ZmNiMGEzODE5MWQ3ZWEyODU2Y2QxMzE3IiwiaWF0IjoxNzg5OTAxNTE4LCJuYmYiOjE3ODk5MDE1MTgsImV4cCI6MTc5MjU4MzUxOCwic3ViIjoiIiwic2NvcGVzIjpbImJhc2ljIl19.APYeDV1QsWu12ZwzIGt9fr1UN17O3JwcdhiZUMxO3kPyzBiQzI_1TxIpJnZuA5xqu67PCwXVMVfh2hrY1fxB0PduU_mdX6nu3SXw0_b2eqxQrwFWPy5_jBcPZCl6F4ehzREbT7zOh8Y1udevz405P9bSyijZyRP8cB1M2neigbdIvLbsvOSVXCh3GR3pIqljG4JVktraRzm3fHjm28HCSLd_B2Gus5qS0YiFPYgHoIo8I1RW0PQaFx55KqIYWr18mAnAOYf2AXI6JLGiJ--ItVlqkuOxn0IB8q3Bm2nTozdSYTRIO9VeiKgCQ1bl0CVkpC2vxV9jTJ42LQ18MDAOaA}
    container_name: loqme-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LISTING_IMAGE_STORAGE_DIR: /app/.data/listing-images
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/loqme?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-loqme-development-session-super-secret-key-change-in-production-32c}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      SMSIR_API_KEY: ${SMSIR_API_KEY:-}
      SMSIR_LINE_NUMBER: ${SMSIR_LINE_NUMBER:-30002108039036}
      SMSIR_TEMPLATE_ID: ${SMSIR_TEMPLATE_ID:-}
      SMSIR_CODE_PARAM_NAME: ${SMSIR_CODE_PARAM_NAME:-Code}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      NEXT_PUBLIC_MAP_API_KEY: ${NEXT_PUBLIC_MAP_API_KEY:-eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsImp0aSI6ImM1ODI4YTAyOTA1ZDNiZTAzNDYzZTNkZmM2Mzc2YTZlMTE3NzhmYTdhZDA0OGJkNzdkZGYxNDM0ZmNiMGEzODE5MWQ3ZWEyODU2Y2QxMzE3In0.eyJhdWQiOiI0NDEyNiIsImp0aSI6ImM1ODI4YTAyOTA1ZDNiZTAzNDYzZTNkZmM2Mzc2YTZlMTE3NzhmYTdhZDA0OGJkNzdkZGYxNDM0ZmNiMGEzODE5MWQ3ZWEyODU2Y2QxMzE3IiwiaWF0IjoxNzg5OTAxNTE4LCJuYmYiOjE3ODk5MDE1MTgsImV4cCI6MTc5MjU4MzUxOCwic3ViIjoiIiwic2NvcGVzIjpbImJhc2ljIl19.APYeDV1QsWu12ZwzIGt9fr1UN17O3JwcdhiZUMxO3kPyzBiQzI_1TxIpJnZuA5xqu67PCwXVMVfh2hrY1fxB0PduU_mdX6nu3SXw0_b2eqxQrwFWPy5_jBcPZCl6F4ehzREbT7zOh8Y1udevz405P9bSyijZyRP8cB1M2neigbdIvLbsvOSVXCh3GR3pIqljG4JVktraRzm3fHjm28HCSLd_B2Gus5qS0YiFPYgHoIo8I1RW0PQaFx55KqIYWr18mAnAOYf2AXI6JLGiJ--ItVlqkuOxn0IB8q3Bm2nTozdSYTRIO9VeiKgCQ1bl0CVkpC2vxV9jTJ42LQ18MDAOaA}
      MAPIR_API_KEY: ${MAPIR_API_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - loqme_listing_images:/app/.data/listing-images
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

