services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: loqme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loqme
    ports:
      - "5432:5432"
    volumes:
      - loqme_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loqme"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_MAP_API_KEY: ${NEXT_PUBLIC_MAP_API_KEY:-}
    container_name: loqme-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LISTING_IMAGE_STORAGE_DIR: /app/.data/listing-images
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/loqme?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-loqme-development-session-super-secret-key-change-in-production-32c}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      SMSIR_API_KEY: ${SMSIR_API_KEY:-}
      SMSIR_LINE_NUMBER: ${SMSIR_LINE_NUMBER:-30002108039036}
      SMSIR_TEMPLATE_ID: ${SMSIR_TEMPLATE_ID:-}
      SMSIR_CODE_PARAM_NAME: ${SMSIR_CODE_PARAM_NAME:-Code}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      NEXT_PUBLIC_MAP_API_KEY: ${NEXT_PUBLIC_MAP_API_KEY:-}
      MAPIR_API_KEY: ${MAPIR_API_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - loqme_listing_images:/app/.data/listing-images
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  loqme_listing_images:
    driver: local
  loqme_pgdata:
    driver: local

