name: Deploy Void Frame

on:
  workflow_dispatch:

env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"
  IMAGE_NAME: ghcr.io/mobingholizadeh/voidframe

concurrency:
  group: voidframe-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      source_sha: ${{ steps.source.outputs.sha }}
      compose: ${{ steps.files.outputs.compose }}
      nginx: ${{ steps.files.outputs.nginx }}
    steps:
      - name: Checkout Void Frame source
        uses: actions/checkout@v4
        with:
          ref: voidframe-source

      - name: Record source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate source
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm run build:selfhost

      - name: Package server manifests
        id: files
        run: |
          echo "compose=$(base64 -w0 docker-compose.server.yml)" >> "$GITHUB_OUTPUT"
          echo "nginx=$(base64 -w0 deploy/nginx-voidframe.conf)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.selfhost
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=voidframe
          cache-to: type=gha,mode=max,scope=voidframe

  deploy:
    name: Deploy beside Loqme
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Encode deployment secrets
        env:
          ADMIN_HASH: ${{ secrets.VOIDFRAME_ADMIN_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.VOIDFRAME_ADMIN_SESSION_SECRET }}
        run: |
          test -n "$ADMIN_HASH"
          test -n "$SESSION_SECRET"
          ADMIN_HASH_B64=$(printf '%s' "$ADMIN_HASH" | base64 -w0)
          SESSION_SECRET_B64=$(printf '%s' "$SESSION_SECRET" | base64 -w0)
          echo "::add-mask::$ADMIN_HASH_B64"
          echo "::add-mask::$SESSION_SECRET_B64"
          echo "ADMIN_HASH_B64=$ADMIN_HASH_B64" >> "$GITHUB_ENV"
          echo "SESSION_SECRET_B64=$SESSION_SECRET_B64" >> "$GITHUB_ENV"

      - name: Install and verify Void Frame
        uses: appleboy/ssh-action@v1.2.0
        env:
          ADMIN_HASH_B64: ${{ env.ADMIN_HASH_B64 }}
          SESSION_SECRET_B64: ${{ env.SESSION_SECRET_B64 }}
          COMPOSE_B64: ${{ needs.build.outputs.compose }}
          NGINX_B64: ${{ needs.build.outputs.nginx }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 15m
          envs: ADMIN_HASH_B64,SESSION_SECRET_B64,COMPOSE_B64,NGINX_B64,SERVER_HOST
          script: |
            set -eu
            umask 077
            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
            $SUDO install -d -m 755 -o "$(id -u)" -g "$(id -g)" /opt/voidframe
            cd /opt/voidframe

            printf '%s' "$COMPOSE_B64" | base64 -d > docker-compose.server.yml.tmp
            VOIDFRAME_IMAGE=ghcr.io/example/voidframe:validation docker compose -f docker-compose.server.yml.tmp config >/dev/null
            mv docker-compose.server.yml.tmp docker-compose.server.yml

            ADMIN_HASH=$(printf '%s' "$ADMIN_HASH_B64" | base64 -d)
            SESSION_SECRET=$(printf '%s' "$SESSION_SECRET_B64" | base64 -d)
            IMAGE="${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}"
            printf 'ADMIN_PASSWORD_HASH=%s\nADMIN_SESSION_SECRET=%s\nVOIDFRAME_IMAGE=%s\n' "$ADMIN_HASH" "$SESSION_SECRET" "$IMAGE" > .env.tmp
            chmod 600 .env.tmp
            mv .env.tmp .env

            printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker compose -f docker-compose.server.yml pull app
            docker compose -f docker-compose.server.yml up -d --remove-orphans app

            READY=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:3100/api/health >/dev/null; then READY=1; break; fi
              sleep 3
            done
            test "$READY" = 1

            printf '%s' "$NGINX_B64" | base64 -d > /tmp/voidframe.conf
            $SUDO install -m 644 /tmp/voidframe.conf /etc/nginx/sites-available/voidframe.conf
            $SUDO ln -sfn /etc/nginx/sites-available/voidframe.conf /etc/nginx/sites-enabled/voidframe.conf
            $SUDO nginx -t
            $SUDO systemctl reload nginx
            curl --fail --silent -H 'Host: voidframe.space' http://127.0.0.1/api/health >/dev/null

            DOMAIN_IP=$(getent ahostsv4 voidframe.space 2>/dev/null | awk 'NR==1 {print $1}')
            WWW_IP=$(getent ahostsv4 www.voidframe.space 2>/dev/null | awk 'NR==1 {print $1}')
            SERVER_IP=$(getent ahostsv4 "$SERVER_HOST" 2>/dev/null | awk 'NR==1 {print $1}')
            if [ -n "$DOMAIN_IP" ] && [ "$DOMAIN_IP" = "$SERVER_IP" ] && [ "$WWW_IP" = "$SERVER_IP" ]; then
              if ! command -v certbot >/dev/null 2>&1; then
                $SUDO apt-get update
                $SUDO apt-get install -y certbot python3-certbot-nginx
              fi
              $SUDO certbot --nginx --non-interactive --agree-tos --register-unsafely-without-email --redirect -d voidframe.space -d www.voidframe.space
              curl --fail --silent https://voidframe.space/api/health >/dev/null
            else
              echo "DNS is not pointed to this server yet; HTTP host is ready and TLS was deferred."
            fi

            printf '%s\n' '{"sourceCommit":"${{ needs.build.outputs.source_sha }}","deploymentRunNumber":${{ github.run_number }}}' > deployed-revision.json.tmp
            chmod 644 deployed-revision.json.tmp
            mv deployed-revision.json.tmp deployed-revision.json
            docker compose -f docker-compose.server.yml ps
