name: Build Android TWA APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Ensure Gradle Wrapper
        run: |
          cd android
          gradle wrapper
          chmod +x ./gradlew

      - name: Assemble Debug APK
        if: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'debug' }}"
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Restore persistent release signing key
        if: github.event.inputs.build_type != 'debug'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/loqme-release.jks"

      - name: Assemble Release APK
        if: github.event.inputs.build_type != 'debug'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/loqme-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Verify release signature and wait for website trust deployment
        if: github.event.inputs.build_type != 'debug'
        run: |
          set -euo pipefail
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/apk-cert.txt"
          python3 scripts/verify-android-release.py "$RUNNER_TEMP/apk-cert.txt" --wait-seconds 900

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/loqme-release.jks"

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_RAW=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_RAW"
          cp "$APK_RAW" "android/app/build/outputs/apk/loqme-app.apk"
          echo "apk_path=android/app/build/outputs/apk/loqme-app.apk" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: loqme-android-twa-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14

      - name: Publish Release Asset to GitHub Releases
        if: github.event.inputs.build_type != 'debug'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Loqme Android TWA (Latest)' }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
          make_latest: true
          body: |
            Signed Loqme Android release for https://loqme.shop.
            If you installed the old debug APK, uninstall that debug app before installing this release.
            Loqme pages use verified full-screen TWA mode; external websites may show browser controls.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
