name: Diagnose production session persistence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -eu
            cd /opt/loqme
            docker compose -f docker-compose.prod.yml exec -T app node - <<'JS'
            const {SignJWT}=require('jose');
            (async()=>{
             const token=await new SignJWT({userId:'diagnostic-nonexistent-user',mobile:'diagnostic',role:'CUSTOMER'}).setProtectedHeader({alg:'HS256'}).setExpirationTime('1m').sign(new TextEncoder().encode(process.env.SESSION_SECRET));
             for(const origin of ['http://localhost:3000','https://loqme.shop']){
              const r=await fetch(origin+'/profile',{headers:{cookie:'loqme_session='+token},redirect:'manual',signal:AbortSignal.timeout(10000)});
              console.log('AUTH_PROBE',JSON.stringify({origin,status:r.status,location:r.headers.get('location'),cache:r.headers.get('cache-control')}));await r.body?.cancel();
             }
             const {Client}=require('pg');const db=new Client({connectionString:process.env.DATABASE_URL});await db.connect();
             const user=await db.query('SELECT "isActive", role FROM "User" WHERE mobile=$1',['09392148140']);
             const otp=await db.query('SELECT "isUsed", attempts FROM "OtpCode" WHERE mobile=$1 ORDER BY "createdAt" DESC LIMIT 1',['09392148140']);
             console.log('AUTH_ACCOUNT',JSON.stringify({exists:user.rowCount>0,active:user.rows[0]?.isActive,role:user.rows[0]?.role,latestOtpUsed:otp.rows[0]?.isUsed,latestOtpAttempts:otp.rows[0]?.attempts}));await db.end();
            })().catch(e=>{console.log('AUTH_DIAGNOSTIC_ERROR',e.name);process.exitCode=1;});
            JS
