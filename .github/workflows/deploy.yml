name: Production Deployment CI/CD

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Enforce Node 24 on GitHub Actions runners to prevent Node 20 deprecation notices
env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production Server
    needs: build-and-push
    runs-on: ubuntu-latest
    # Do NOT evaluate secrets in job-level 'if' condition to prevent parser errors
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Verify Deployment Secrets Configuration
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        if: env.SERVER_HOST == ''
        run: |
          echo "::warning::SERVER_HOST secret is not configured. Skipping remote SSH deployment."
          exit 0

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        if: env.SERVER_HOST != ''
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            set -e
            echo "🚀 Starting Loqme Production Deployment..."

            # Authenticate Docker daemon to GitHub Container Registry on server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Navigate to production deployment directory
            DEPLOY_DIR="/opt/loqme"
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "Creating deployment directory: $DEPLOY_DIR"
              sudo mkdir -p "$DEPLOY_DIR"
              sudo chown -R $USER:$USER "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"

            # Pull latest production container image
            echo "📥 Pulling latest application image..."
            docker compose -f docker-compose.prod.yml pull app

            # Zero-downtime rolling restart of production services
            echo "🔄 Starting production services..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Apply Prisma database migrations inside the running container
            echo "📦 Running Prisma database migrations..."
            docker compose -f docker-compose.prod.yml exec -T app npx prisma migrate deploy

            # Prune dangling/unused images to preserve disk space
            echo "🧹 Pruning unused container images..."
            docker image prune -af --filter "until=72h"

            # Check container health status
            echo "✅ Checking running container status..."
            docker compose -f docker-compose.prod.yml ps
            echo "🎉 Deployment successfully completed!"
