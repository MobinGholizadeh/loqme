name: Void Frame Production CI/CD

on:
  push:
    branches:
      - voidframe-source
  workflow_dispatch:

env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"
  IMAGE_NAME: ghcr.io/mobingholizadeh/voidframe

concurrency:
  group: voidframe-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate storefront
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm run build:selfhost

      - name: Exercise production upload and checkout flow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy/data
          PASSWORD='ci-owner-password-voidframe-2026'
          printf '%s' "$PASSWORD" > .deploy/admin-password
          HASH=$(node --input-type=module -e "import{randomBytes,scryptSync}from'node:crypto';const p=process.argv[1],s=randomBytes(16).toString('hex');console.log('scrypt$'+s+'$'+scryptSync(p,s,32).toString('hex'))" "$PASSWORD")
          ADMIN_PASSWORD_HASH="$HASH" \
          ADMIN_SESSION_SECRET='ci-session-secret-voidframe-at-least-32-characters' \
          DATA_DIR="$PWD/.deploy/data" PORT=3101 HOSTNAME=127.0.0.1 \
          node .next/standalone/server.js > .deploy/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3101/api/health >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then cat .deploy/server.log; exit 1; fi
            sleep 1
          done
          npm run test:selfhost

  build:
    name: Build and publish immutable image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      source_sha: ${{ steps.source.outputs.sha }}
      compose: ${{ steps.files.outputs.compose }}
      nginx_http: ${{ steps.files.outputs.nginx_http }}
      nginx_tls: ${{ steps.files.outputs.nginx_tls }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Record source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package server manifests
        id: files
        run: |
          echo "compose=$(base64 -w0 docker-compose.server.yml)" >> "$GITHUB_OUTPUT"
          echo "nginx_http=$(base64 -w0 deploy/nginx-voidframe.conf)" >> "$GITHUB_OUTPUT"
          echo "nginx_tls=$(base64 -w0 deploy/nginx-voidframe-tls.conf)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.selfhost
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=voidframe
          cache-to: type=gha,mode=max,scope=voidframe

  deploy:
    name: Deploy and verify production
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Encode deployment secrets
        env:
          ADMIN_HASH: ${{ secrets.VOIDFRAME_ADMIN_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.VOIDFRAME_ADMIN_SESSION_SECRET }}
        run: |
          test -n "$ADMIN_HASH"
          test -n "$SESSION_SECRET"
          ADMIN_HASH_B64=$(printf '%s' "$ADMIN_HASH" | base64 -w0)
          SESSION_SECRET_B64=$(printf '%s' "$SESSION_SECRET" | base64 -w0)
          echo "::add-mask::$ADMIN_HASH_B64"
          echo "::add-mask::$SESSION_SECRET_B64"
          echo "ADMIN_HASH_B64=$ADMIN_HASH_B64" >> "$GITHUB_ENV"
          echo "SESSION_SECRET_B64=$SESSION_SECRET_B64" >> "$GITHUB_ENV"

      - name: Deploy through existing server connection
        uses: appleboy/ssh-action@v1.2.0
        env:
          ADMIN_HASH_B64: ${{ env.ADMIN_HASH_B64 }}
          SESSION_SECRET_B64: ${{ env.SESSION_SECRET_B64 }}
          COMPOSE_B64: ${{ needs.build.outputs.compose }}
          NGINX_HTTP_B64: ${{ needs.build.outputs.nginx_http }}
          NGINX_TLS_B64: ${{ needs.build.outputs.nginx_tls }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 15m
          envs: ADMIN_HASH_B64,SESSION_SECRET_B64,COMPOSE_B64,NGINX_HTTP_B64,NGINX_TLS_B64,SERVER_HOST
          script: |
            set -eu
            umask 077
            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
            $SUDO install -d -m 755 -o "$(id -u)" -g "$(id -g)" /opt/voidframe
            cd /opt/voidframe

            cp -f docker-compose.server.yml docker-compose.server.yml.rollback 2>/dev/null || true
            cp -f .env .env.rollback 2>/dev/null || true
            rollback() {
              echo "New release failed; restoring the previous Void Frame image."
              cp -f docker-compose.server.yml.rollback docker-compose.server.yml 2>/dev/null || true
              cp -f .env.rollback .env 2>/dev/null || true
              docker compose -f docker-compose.server.yml up -d --remove-orphans app || true
            }

            printf '%s' "$COMPOSE_B64" | base64 -d > docker-compose.server.yml.tmp
            mv docker-compose.server.yml.tmp docker-compose.server.yml
            ADMIN_HASH=$(printf '%s' "$ADMIN_HASH_B64" | base64 -d)
            SESSION_SECRET=$(printf '%s' "$SESSION_SECRET_B64" | base64 -d)
            IMAGE="${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}"
            printf "ADMIN_PASSWORD_HASH='%s'\nADMIN_SESSION_SECRET='%s'\nVOIDFRAME_IMAGE=%s\n" "$ADMIN_HASH" "$SESSION_SECRET" "$IMAGE" > .env.tmp
            chmod 600 .env.tmp
            mv .env.tmp .env
            docker compose -f docker-compose.server.yml config >/dev/null

            printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            if ! docker compose -f docker-compose.server.yml pull app || ! docker compose -f docker-compose.server.yml up -d --remove-orphans app; then
              rollback
              exit 1
            fi

            READY=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:3100/api/health >/dev/null; then READY=1; break; fi
              sleep 3
            done
            if [ "$READY" != 1 ]; then rollback; exit 1; fi
            docker compose -f docker-compose.server.yml exec -T app node -e 'if(!/^scrypt\$[a-f0-9]{32}\$[a-f0-9]{64}$/.test(process.env.ADMIN_PASSWORD_HASH||"")){console.error("Invalid runtime owner password hash");process.exit(1)}'

            printf '%s' "$NGINX_HTTP_B64" | base64 -d > /tmp/voidframe-http.conf
            printf '%s' "$NGINX_TLS_B64" | base64 -d > /tmp/voidframe-tls.conf
            if [ -f /etc/letsencrypt/live/voidframe.space/fullchain.pem ]; then
              $SUDO install -m 644 /tmp/voidframe-tls.conf /etc/nginx/sites-available/voidframe.conf
            else
              $SUDO install -m 644 /tmp/voidframe-http.conf /etc/nginx/sites-available/voidframe.conf
            fi
            $SUDO ln -sfn /etc/nginx/sites-available/voidframe.conf /etc/nginx/sites-enabled/voidframe.conf
            $SUDO nginx -t
            $SUDO systemctl reload nginx
            curl --fail --silent -H 'Host: voidframe.space' http://127.0.0.1/api/health >/dev/null

            if ! command -v certbot >/dev/null 2>&1; then
              $SUDO apt-get update
              $SUDO apt-get install -y certbot python3-certbot-nginx
            fi
            if [ ! -f /etc/letsencrypt/live/voidframe.space/fullchain.pem ]; then
              $SUDO certbot --nginx --non-interactive --agree-tos --register-unsafely-without-email -d voidframe.space -d www.voidframe.space
            fi
            $SUDO install -m 644 /tmp/voidframe-tls.conf /etc/nginx/sites-available/voidframe.conf
            $SUDO nginx -t
            $SUDO systemctl reload nginx
            curl --fail --silent --resolve voidframe.space:443:127.0.0.1 https://voidframe.space/api/health >/dev/null

            printf '%s\n' '{"sourceCommit":"${{ needs.build.outputs.source_sha }}","deploymentRunNumber":${{ github.run_number }}}' > deployed-revision.json.tmp
            chmod 644 deployed-revision.json.tmp
            mv deployed-revision.json.tmp deployed-revision.json
            rm -f .env.rollback docker-compose.server.yml.rollback
            docker compose -f docker-compose.server.yml ps
