services:
  app:
    image: ${VOIDFRAME_IMAGE:?Set VOIDFRAME_IMAGE to an immutable image digest}
    container_name: voidframe-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - voidframe_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:3000/api/health.php') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  voidframe_data:
    name: voidframe_data
