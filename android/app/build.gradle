plugins {
    id 'com.android.application'
}

android {
    namespace "ir.loqme.app"
    compileSdk 34

    defaultConfig {
        applicationId "ir.loqme.app"
        minSdk 21
        targetSdk 34
        versionCode = Integer.parseInt(System.getenv("ANDROID_VERSION_CODE") ?: "2")
        versionName = System.getenv("ANDROID_VERSION_NAME") ?: "1.1.0-dev"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Placeholders used in AndroidManifest.xml for TWA LauncherActivity
        manifestPlaceholders = [
            hostName: "loqme.shop",
            defaultUrl: "https://loqme.shop",
            appName: "لقمه",
            assetStatements: '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"web","site":"https://loqme.shop"}}]'
        ]
    }

    signingConfigs {
        release {
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.core:core:1.13.1'

    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because('kotlin-stdlib-jdk7 is now part of kotlin-stdlib')
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because('kotlin-stdlib-jdk8 is now part of kotlin-stdlib')
        }
    }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

