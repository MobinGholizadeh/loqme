version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: loqme-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loqme_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loqme_secure_db_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-loqme}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - loqme_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loqme_admin} -d ${POSTGRES_DB:-loqme}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - loqme-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loqme-web-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-loqme_admin}:${POSTGRES_PASSWORD:-loqme_secure_db_pass_2026}@postgres:5432/${POSTGRES_DB:-loqme}?schema=public
      SESSION_SECRET: ${SESSION_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://loqme.shop}
      SMS_PROVIDER: ${SMS_PROVIDER:-kavenegar}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - loqme-network

networks:
  loqme-network:
    driver: bridge

volumes:
  loqme_prod_pgdata:
    driver: local
