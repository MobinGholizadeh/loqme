# ==============================================================================
# Production Nginx Configuration for Loqme (لقمه)
# Domain: loqme.ir (or custom domain)
# Target Server: Ubuntu 24.04 / 26.04 LTS
# Upstream: Next.js App (127.0.0.1:3000)
# ==============================================================================

# Map for WebSocket Upgrade header handling
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Upstream definitions
upstream loqme_app_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server Block (Port 80) - Enforce HTTPS Redirection
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name loqme.ir www.loqme.ir;

    # Allow Let's Encrypt ACME challenge verification if needed
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
    }

    # Redirect all HTTP requests permanently to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Main HTTPS Server Block (Port 443) - Loqme Marketplace Application
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name loqme.ir www.loqme.ir;

    # SSL Certificates (placed in /etc/ssl/loqme/)
    ssl_certificate /etc/ssl/loqme/fullchain.pem;
    ssl_certificate_key /etc/ssl/loqme/privateKey.pem;

    # Modern TLS Protocols and High-Security Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Caching & Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:LoqmeSSL:10m;
    ssl_session_tickets off;

    # Request limits (prevent HTTP 413 on merchant food photo uploads)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;

    # Compression (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Digital Asset Links for Android TWA verification (Cache for 1 hour)
    location = /.well-known/assetlinks.json {
        proxy_pass http://loqme_app_upstream;
        proxy_set_header Host $host;
        add_header Content-Type application/json;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Next.js Static Assets (Immutable, Cachable for 1 year)
    location /_next/static/ {
        proxy_pass http://loqme_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public static media files (Favicons, images, fonts)
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|avif|woff|woff2|ttf|eot)$ {
        proxy_pass http://loqme_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Real-time WebSocket & Server-Sent Events (SSE) Route
    location /api/events/ {
        proxy_pass http://loqme_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time low latency event streams
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Main Application Reverse Proxy
    location / {
        proxy_pass http://loqme_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

